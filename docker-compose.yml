services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stocksense
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stocksense:${POSTGRES_PASSWORD}@db:5432/stocksense
      REDIS_URL: redis://redis:6379/0
      ASYNC_FORECASTS: "1"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
  worker:
    build: ./backend
    command: celery -A app.workers.tasks worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stocksense:${POSTGRES_PASSWORD}@db:5432/stocksense
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]
  beat:
    build: ./backend
    command: celery -A app.workers.tasks beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stocksense:${POSTGRES_PASSWORD}@db:5432/stocksense
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  pgdata:
